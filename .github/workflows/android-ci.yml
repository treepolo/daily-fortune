name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DAILY_FORTUNE_CONFIG_URL: https://jwmdidkzqkacwwjzakja.supabase.co/functions/v1/experiment-config
      DAILY_FORTUNE_ANALYTICS_URL: https://jwmdidkzqkacwwjzakja.supabase.co/functions/v1/analytics-events
      DAILY_FORTUNE_UPLOAD_KEYSTORE_B64: ${{ secrets.DAILY_FORTUNE_UPLOAD_KEYSTORE_B64 }}
      DAILY_FORTUNE_RELEASE_STORE_PASSWORD: ${{ secrets.DAILY_FORTUNE_RELEASE_STORE_PASSWORD }}
      DAILY_FORTUNE_RELEASE_KEY_ALIAS: ${{ secrets.DAILY_FORTUNE_RELEASE_KEY_ALIAS }}
      DAILY_FORTUNE_RELEASE_KEY_PASSWORD: ${{ secrets.DAILY_FORTUNE_RELEASE_KEY_PASSWORD }}
      DAILY_FORTUNE_RELEASE_KEYSTORE_PATH: /tmp/daily-fortune-upload.jks
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check research backend
        run: |
          deno check supabase/functions/experiment-config/index.ts
          deno check supabase/functions/analytics-events/index.ts
          deno test supabase/functions/_shared/experiment_core_test.ts
      - name: Smoke test deployed research backend
        shell: bash
        run: |
          set -euo pipefail
          installation_id="11111111-1111-4111-8111-111111111111"
          curl --fail --silent --show-error \
            "${DAILY_FORTUNE_CONFIG_URL}?installation_id=${installation_id}&app_version=ci&timezone=UTC" \
            -o /tmp/daily-fortune-config.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/daily-fortune-config.json').read_text())
          assert data['config_id'].startswith('resolved-')
          assert data['fortune']['sampling']['mode'] == 'INDEPENDENT'
          assert len(data['fortune']['initial_distribution']['probabilities']) == 7
          assert len(data['fortune']['reroll_distribution']['probabilities']) == 7
          assert data['ads']['enabled'] is False
          assert data['ads']['provider'] == 'ADMOB'
          assert data['ads']['rewarded_unit_id'] == 'ca-app-pub-8284304703726644/9731073792'
          assert data['ads']['bypass_overall_scores'] == [7]
          PY

          event_id="$(cat /proc/sys/kernel/random/uuid)"
          now_ms="$(( $(date +%s) * 1000 ))"
          EVENT_ID="$event_id" NOW_MS="$now_ms" python3 - <<'PY'
          import json, os
          from pathlib import Path
          event = {
              'event_id': os.environ['EVENT_ID'],
              'installation_id': '11111111-1111-4111-8111-111111111111',
              'session_id': 'github-actions-smoke',
              'event_name': 'ci_backend_smoke',
              'event_epoch_millis': int(os.environ['NOW_MS']),
              'local_datetime': '2026-01-01T00:00:00',
              'timezone_id': 'UTC',
              'app_version': 'ci',
              'config_id': 'ci-smoke',
              'assignments': [],
              'payload': {'github_run_id': '${{ github.run_id }}'},
          }
          Path('/tmp/daily-fortune-events.json').write_text(json.dumps({'events': [event]}))
          PY
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/daily-fortune-events.json \
            "$DAILY_FORTUNE_ANALYTICS_URL" \
            -o /tmp/daily-fortune-analytics.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/daily-fortune-analytics.json').read_text())
          assert data.get('accepted') == 1
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Play upload signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DAILY_FORTUNE_UPLOAD_KEYSTORE_B64:-}" && \
                -n "${DAILY_FORTUNE_RELEASE_STORE_PASSWORD:-}" && \
                -n "${DAILY_FORTUNE_RELEASE_KEY_ALIAS:-}" && \
                -n "${DAILY_FORTUNE_RELEASE_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$DAILY_FORTUNE_UPLOAD_KEYSTORE_B64" | base64 --decode > "$DAILY_FORTUNE_RELEASE_KEYSTORE_PATH"
            chmod 600 "$DAILY_FORTUNE_RELEASE_KEYSTORE_PATH"
            echo "signed" > /tmp/release-signing.txt
          else
            echo "unsigned-needs-github-secrets" > /tmp/release-signing.txt
            unset DAILY_FORTUNE_RELEASE_STORE_PASSWORD DAILY_FORTUNE_RELEASE_KEY_ALIAS DAILY_FORTUNE_RELEASE_KEY_PASSWORD
          fi
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build QA APK and Play AAB
        run: ./gradlew :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Upload QA APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: daily-fortune-qa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Play AAB
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: daily-fortune-play-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            /tmp/release-signing.txt
          if-no-files-found: error
          retention-days: 14
