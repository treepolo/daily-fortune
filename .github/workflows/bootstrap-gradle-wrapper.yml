name: Bootstrap Gradle Wrapper

on:
  push:
    paths:
      - '.github/workflows/bootstrap-gradle-wrapper.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.5.0
      - name: Commit wrapper if needed
        shell: bash
        run: |
          if git status --porcelain -- gradlew gradlew.bat gradle/wrapper | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "chore: add Gradle wrapper"
            git push
          else
            echo "Gradle wrapper already up to date."
          fi
